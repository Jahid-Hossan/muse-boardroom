<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSE AI // Executive Boardroom & CEO Command Center</title>
  
  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    /* Top Header */
    header {
      height: 60px;
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      font-size: 24px;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    /* Main Content Layout */
    .layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* Left Sidebar */
    aside {
      width: 260px;
      background: #0f172a;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #1e293b;
    }
    .sidebar-header h2 {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .account-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .account-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 10px;
    }
    .account-avatar {
      font-size: 20px;
    }
    .account-info {
      flex: 1;
    }
    .account-name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .account-role {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Main Chat Section */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #0b0f19;
      position: relative;
    }
    #chatFeed {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Chat Messages */
    .msg-card {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      max-width: 900px;
      line-height: 1.6;
    }
    .msg-card.ceo {
      background: #1c1917;
      border-left: 4px solid #f59e0b;
      border-color: rgba(245, 158, 11, 0.3);
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #f59e0b;
    }
    .msg-card.agent .msg-header {
      color: #38bdf8;
    }
    .msg-body {
      font-size: 14px;
      color: #e2e8f0;
    }
    .msg-body h3 {
      font-size: 15px;
      color: #fff;
      margin: 8px 0 4px 0;
    }
    .msg-body p {
      margin-bottom: 6px;
    }
    .msg-body ul {
      margin-left: 20px;
      margin-bottom: 6px;
    }

    /* Bottom Input Bar - Fixed and Pinpoint Visible */
    #inputBar {
      flex-shrink: 0;
      background: #0f172a;
      border-top: 2px solid #334155;
      padding: 16px 24px;
      width: 100%;
      z-index: 50;
    }
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }
    #commandInput {
      flex: 1;
      width: 100%;
      height: 52px;
      background: #1e293b;
      border: 2px solid #475569;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      padding: 14px 18px;
      outline: none;
      font-family: inherit;
    }
    #commandInput:focus {
      border-color: #f59e0b;
      background: #243047;
    }
    #sendBtn {
      height: 52px;
      padding: 0 28px;
      background: #f59e0b;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }
    #sendBtn:hover {
      background: #fbbf24;
    }
    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status-indicator {
      display: none;
      padding: 8px 24px;
      background: #1e293b;
      border-top: 1px solid #334155;
      font-size: 12px;
      color: #f59e0b;
      text-align: center;
    }
    .status-indicator.active {
      display: block;
    }
  </style>
</head>
<body>

  <div id="app">

    <!-- Top Header -->
    <header>
      <div class="brand">
        <span class="brand-logo">👑</span>
        <div class="brand-title">
          MUSE AI CEO COMMAND CENTER
          <span class="badge">4 Accounts Active</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-danger" onclick="clearBoardroom()">Clear Chat</button>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="layout">

      <!-- Left Sidebar: 4 Accounts -->
      <aside>
        <div class="sidebar-header">
          <h2>Connected Accounts (4)</h2>
        </div>
        <div class="account-list" id="agentRoster">
          <div class="account-card">
            <span class="account-avatar">📊</span>
            <div class="account-info">
              <div class="account-name">Muse-1 <span class="status-dot"></span></div>
              <div class="account-role">Chief Strategy Officer</div>
            </div>
          </div>
          <div class="account-card">
            <span class="account-avatar">🚀</span>
            <div class="account-info">
              <div class="account-name">Muse-2 <span class="status-dot"></span></div>
              <div class="account-role">Chief Marketing Officer</div>
            </div>
          </div>
          <div class="account-card">
            <span class="account-avatar">⚙️</span>
            <div class="account-info">
              <div class="account-name">Muse-3 <span class="status-dot"></span></div>
              <div class="account-role">Chief Technology Officer</div>
            </div>
          </div>
          <div class="account-card">
            <span class="account-avatar">🛡️</span>
            <div class="account-info">
              <div class="account-name">Muse-4 <span class="status-dot"></span></div>
              <div class="account-role">Chief Operating Officer</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Center Chat Area -->
      <main>
        <div id="chatFeed">
          <!-- Messages will load here -->
        </div>

        <div id="statusIndicator" class="status-indicator">
          ⏳ 4 Muse AI accounts are analyzing your CEO directive...
        </div>

        <!-- The Command Input Bar -->
        <div id="inputBar">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="commandInput" 
              placeholder="👑 Type CEO Directive here and press Enter (or click Send)..." 
              autocomplete="off"
            />
            <button id="sendBtn" onclick="sendCommand()">
              SEND
            </button>
          </div>
        </div>
      </main>

    </div>

  </div>

  <script>
    let isSending = false;

    document.addEventListener('DOMContentLoaded', () => {
      loadMessages();
      const input = document.getElementById('commandInput');
      if (input) {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            sendCommand();
          }
        });
        input.focus();
      }
    });

    async function loadMessages() {
      try {
        const res = await fetch('/api/messages');
        const msgs = await res.json();
        renderMessages(msgs);
      } catch (err) {
        console.error("Failed to load messages:", err);
      }
    }

    function renderMessages(messages) {
      const feed = document.getElementById('chatFeed');
      if (!feed) return;
      feed.innerHTML = '';

      messages.forEach(msg => {
        const card = document.createElement('div');
        card.className = `msg-card ${msg.sender === 'ceo' ? 'ceo' : 'agent'}`;
        
        const header = document.createElement('div');
        header.className = 'msg-header';
        header.innerHTML = `<span>${msg.senderName} (${msg.role})</span><span>${new Date(msg.timestamp).toLocaleTimeString()}</span>`;
        
        const body = document.createElement('div');
        body.className = 'msg-body';
        body.innerHTML = window.marked ? marked.parse(msg.text) : msg.text;

        card.appendChild(header);
        card.appendChild(body);
        feed.appendChild(card);
      });

      feed.scrollTop = feed.scrollHeight;
    }

    async function sendCommand() {
      if (isSending) return;
      const input = document.getElementById('commandInput');
      const sendBtn = document.getElementById('sendBtn');
      const indicator = document.getElementById('statusIndicator');

      const text = input ? input.value.trim() : '';
      if (!text) return;

      isSending = true;
      if (sendBtn) sendBtn.disabled = true;
      if (indicator) indicator.classList.add('active');

      try {
        const res = await fetch('/api/command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: text, mode: 'broadcast' })
        });
        const data = await res.json();
        if (input) input.value = '';
        await loadMessages();
      } catch (err) {
        console.error("Send error:", err);
      } finally {
        isSending = false;
        if (sendBtn) sendBtn.disabled = false;
        if (indicator) indicator.classList.remove('active');
        if (input) input.focus();
      }
    }

    async function clearBoardroom() {
      if (!confirm("Are you sure you want to clear chat history?")) return;
      try {
        await fetch('/api/messages', { method: 'DELETE' });
        await loadMessages();
      } catch (e) {
        console.error(e);
      }
    }
  </script>
</body>
</html>
